[plugin]

name="Controller (Lite)"
description="Free no-code player movement for Godot 4.5+, in 2D and 3D. Top-down mover with acceleration/friction, a press-E Interactor/Interactable pair with bus-mirrored event strings, a 3D follow camera, and reason-counted movement locks for dialogue, baked onto any node from the editor chooser dock. Upgrade to Controller (Pro) for the platformer and third-person movers (coyote time, jump buffer, variable jump height), the 2D follow camera and the orbit camera (deadzone, look-ahead, shake, mouse look), and touch-friendly public input methods."
author="Sean Elovirta"
version="1.3.0"
script="plugin.gd"
