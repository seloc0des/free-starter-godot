[plugin]

name="Controller (Lite)"
description="Free no-code player movement for Godot 4.5+. Top-down 8-way mover with acceleration/friction, a press-E Interactor/Interactable pair with bus-mirrored event strings, and reason-counted movement locks for dialogue, baked onto any node from the editor chooser dock. Upgrade to Controller (Pro) for the platformer mover (coyote time, jump buffer, variable jump height), the follow camera (deadzone, look-ahead, shake), and touch-friendly public input methods."
author="Sean Elovirta"
version="1.0.1"
script="plugin.gd"
