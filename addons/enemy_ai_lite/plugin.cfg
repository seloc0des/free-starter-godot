[plugin]

name="Enemy AI (Lite)"
description="Free no-code enemy brain for Godot 4.5+, in 2D and 3D. Drop it on any CharacterBody2D or CharacterBody3D: it idles, chases whatever is in the 'player' group, attacks on a cooldown, and leashes back home when kited. All Inspector radii, baked on from the editor chooser dock. Upgrade to Enemy AI (Pro) for waypoint patrol routes, flee-at-low-health, swinging any node you point the brain at, and the spawner with endless + wave modes."
author="Sean Elovirta"
version="1.2.0"
script="plugin.gd"
