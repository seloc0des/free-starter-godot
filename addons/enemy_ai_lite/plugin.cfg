[plugin]

name="Enemy AI (Lite)"
description="Free no-code enemy brain for Godot 4.5+. Drop it on any CharacterBody2D: it idles, chases whatever is in the 'player' group, attacks on a cooldown, and leashes back home when kited. All Inspector radii, baked on from the editor chooser dock. Upgrade to Enemy AI (Pro) for waypoint patrol routes, flee-at-low-health, CombatHitbox attack activation, and the spawner with endless + wave modes."
author="Sean Elovirta"
version="1.0.1"
script="plugin.gd"
