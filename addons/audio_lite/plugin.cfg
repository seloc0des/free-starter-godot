[plugin]

name="Audio (Lite)"
description="Free no-code game audio core for Godot 4.5+. A crossfading music deck (never a hard cut, same-track no-op), a pooled SFX system with pitch jitter, walk-in Audio Zones that swap the music and restore it on exit, and runtime-created Music/SFX buses that match the Settings pack's sliders. Upgrade to Audio (Pro) for the layered intensity track (explore→combat, auto-driven by Combat hits), the ambience channel, positional 2D SFX, ambient emitters, and the Day/Night ambience hook."
author="Sean Elovirta"
version="1.0.1"
script="plugin.gd"
