[plugin]

name="Dialogue (Lite)"
description="Free branching dialogue for Godot 4.5+. Author conversations in a no-code editor dock (speaker lines, player choices, per-node event hooks), shown with a drop-in dialogue box. Upgrade to Dialogue (Pro) for conditions, flags & variables, direct quest/inventory hooks, portraits, typewriter text, localization, save-aware state, and condition/action dock authoring."
author="Sean Elovirta"
version="1.1.2"
script="plugin.gd"
