name="Dialogue — Lite"
description="Free branching dialogue for Godot 4.3+. Speaker lines, player choices, and per-node event hooks — authored as data, shown with a drop-in dialogue box. Upgrade to Dialogue (Pro) for conditions, flags & variables, direct quest/inventory hooks, portraits, typewriter text, localization, save-aware state, and an editor dock."
