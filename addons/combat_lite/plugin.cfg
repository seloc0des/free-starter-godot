[plugin]

name="Combat (Lite)"
description="Free no-code combat core for Godot 4.3+. Health component + team-gated Hitbox/Hurtbox areas + a global hit bus for VFX. Bake the components onto any node from the editor chooser dock. No code. Upgrade to Combat (Pro) for damage types & crits, resistances, armor, knockback, i-frames, death/respawn, hitstop, and projectiles."
