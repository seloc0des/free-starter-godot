[plugin]

name="Scene Flow (Lite)"
description="Free no-code scene travel for Godot 4.3+. Doors that walk between scenes with fade transitions and named spawn points, baked onto any node from the editor chooser dock. Upgrade to Scene Flow (Pro) for checkpoints + one-call respawn, world-state flags (global and per-scene, save-aware), press-E doors, and locked/key-gated doors."
author="Sean Elovirta"
version="1.0.1"
script="plugin.gd"
